name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secretos:
    name: Fuga de secretos
    runs-on: ubuntu-latest
    env:
      # La accion oficial exige licencia de pago para organizaciones; el binario es libre.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Buscar secretos en el historial
        run: gitleaks git . --redact --no-banner

  calidad:
    name: Tipos, lint y build
    runs-on: ubuntu-latest
    env:
      # Valores ficticios: el build solo necesita que las variables existan y tengan forma valida.
      NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci
      ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:check
      - run: npm run db:test
      - run: npm run build
